global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'automata-backend'
    metrics_path: '/api/v1/metrics/prometheus'
    static_configs:
      - targets: ['backend:8000', 'host.docker.internal:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
